  # Known Nepali operators with NO verified numeric ASN as of 2026-08-05 --
  # deliberately left out of the numeric table rather than guessed again.
  # Websurfer Nepal: websurfer.com.np's own site returned no Cymru origin
  #   data (may be CDN-fronted or the domain guess itself may be stale).
  # Smart Cell / Smart Telecom: smartcell.com.np did not resolve at all;
  #   the real domain and ASN are both unconfirmed.
  # NPIX (Nepal Internet Exchange) member ASNs: not a single ASN, would need
  #   enumerating IXP participants separately.
  # These still have a fighting chance of being caught by the name-pattern
  # fallback below if their true ASN's registered name contains a
  # recognizable substring -- but will legitimately land in "unknown" most
  # of the time until someone looks up their real ASN.

# Regex fallbacks applied to the ASN's registered name when the numeric ASN is
# absent from the table above. A match still records the raw name so that the
# decision is auditable; it does not overwrite an explicit numeric entry.
name_patterns:
  foreign_cdn:
    - "(?i)cloudflare"
    - "(?i)fastly"
    - "(?i)akamai"
    - "(?i)cloudfront"
    - "(?i)edgecast|edgio|limelight"
    - "(?i)bunny\\s*cdn|bunnyway"
  foreign_hosting:
    - "(?i)digitalocean"
    - "(?i)hetzner"
    - "(?i)linode"
    - "(?i)ovh"
    - "(?i)vultr|choopa"
    - "(?i)namecheap|hostinger|godaddy|bluehost|hostgator"
    - "(?i)whg[ -]hosting|whg-"
    - "(?i)leaseweb|interserver|hostdime|network\\s*solutions"
  nepali_hosting:
    - "(?i),\\s*NP$"          # Cymru appends the country code
    - "(?i)nepal"
    - "(?i)subisu|worldlink|vianet|classic\\s*tech|websurfer|techminds|arrownet|broadlink"
    - "(?i)ncell|nptelecom|nitc|npix|nren|dish\\s*media|mercantile"
