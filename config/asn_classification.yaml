# ASN -> ownership class mapping.
#
# This file is an artifact of the paper: RQ2 ("of the hosts that support HTTP/3,
# how many are served by foreign CDNs vs. origins in Nepal?") is answered
# entirely by this mapping applied to observed IPs. It is therefore versioned,
# published with the repository, and never edited implicitly by code.
#
# Classes:
#   foreign_cdn      - global anycast CDN / edge network, origin location unknown
#   foreign_hosting  - foreign IaaS/VPS/dedicated hosting, not an edge CDN
#   nepali_hosting   - AS registered to a Nepali operator, announced from Nepal
#   unknown          - not in this file. NEVER silently bucketed. Reported as
#                      its own count in every RQ2 table.
#
# Provenance: the foreign_cdn/foreign_hosting entries below are large,
# well-known global providers (Cloudflare, Akamai, AWS, etc.) whose ASN
# numbers are stable, widely published, public knowledge -- low error risk.
# The nepali_hosting entries are the opposite case: small, less-documented
# regional operators where a wrong guess is easy to make and easy to miss.
# Every nepali_hosting numeric entry was therefore live-verified against
# Team Cymru's DNS whois on 2026-08-05 (see that section's own comment for
# what that caught). Re-verify the foreign entries against
# https://bgp.tools / RIPEstat before publication too -- ASN allocations do
# occasionally change hands -- but they were not the section that turned out
# to be wrong during this build.
version: "2026-08-05"

classes:
  - foreign_cdn
  - foreign_hosting
  - nepali_hosting
  - unknown

