  # ---------------- nepali_hosting ----------------
  # Every entry below was LIVE-VERIFIED against Team Cymru's DNS whois
  # (AS<n>.asn.cymru.com) on 2026-08-05 by probe/asn_probe.py -- not
  # recalled from training data. This distinction matters: the first draft
  # of this section (recalled, not verified) got roughly half its ASN
  # numbers wrong -- e.g. it had 38565 labeled "Subisu Cablenet" when
  # AS38565 is actually Ncell; had 17465 labeled "Websurfer Nepal" when
  # AS17465 is an Indian cable ISP with no Nepal connection at all. A wrong
  # numeric ASN in this direction (a real foreign ASN mislabeled as
  # nepali_hosting) is the dangerous failure mode for RQ2 -- it would
  # silently misclassify any domain actually hosted on that foreign ASN.
  # Every wrong guess from the first draft was removed rather than kept
  # alongside a correction. See phases.md Phase 2 for the full account.
  17501: {class: nepali_hosting, name: "WorldLink Communications Pvt Ltd"}
  23752: {class: nepali_hosting, name: "Nepal Telecommunications Corporation (NTC)"}
