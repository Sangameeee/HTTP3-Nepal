# Banking, insurance and capital-markets seed list.
#
# Provenance: Nepal Rastra Bank "List of Licensed BFIs" (classes A commercial,
# B development, C finance, D microfinance), Nepal Insurance Authority licensed
# insurer list, and NEPSE/CDSC/SEBON. Institution *names* and class membership
# were cross-checked on 2026-08-05 against en.wikipedia.org/wiki/List_of_banks_in_Nepal
# and investopaper.com's Class-A list; Class B/C domain strings were taken
# directly from Wikipedia's table where it listed a URL. Class A domains and
# insurer domains were not corroborated by an external source with a listed
# URL (neither Wikipedia's Class-A table nor NRB's own site surfaced them in
# search) and are therefore best-effort recall of well-known brand domains.
# This is a documented limitation: candidates that don't resolve are dropped
# by build_corpus.py's DNS-validation step and logged to corpus/rejected.csv,
# not silently kept, but a wrong-but-resolving guess (e.g. a parked domain
# under a plausible name) would not be caught by that filter. Before
# submission, spot-check this file's Class-A and insurer rows against
# https://www.nrb.org.np and https://www.nia.gov.np directly.
#
# Domains are the institutions' public web presence, not their e-banking
# portals; e-banking hostnames are frequently on separate infrastructure and are
# picked up separately by CT enumeration, which is the point of doing both.
sector: banking
source: curated_nrb_nia_nepse
notes: "NRB class A-D licensed institutions, insurers, capital markets infrastructure"
