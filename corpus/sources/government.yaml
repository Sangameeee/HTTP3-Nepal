# Government seed list.
#
# Provenance: compiled by hand from the national portal (nepal.gov.np) ministry
# index, the Office of the Prime Minister and Council of Ministers listing, and
# the seven provincial government portals, as of 2026-08-05.
#
# This list only SEEDS the enumeration. The authoritative government sample
# comes from Certificate Transparency (%.gov.np) plus the nepal.gov.np crawl;
# entries here that do not resolve are dropped and logged in
# corpus/rejected.csv rather than silently kept.
#
# These entries are best-effort recall of ministry/department names and
# conventional gov.np naming patterns, not independently verified against a
# live crawl of nepal.gov.np at authoring time. That live crawl and CT
# enumeration (both run by build_corpus.py) are what actually establishes
# corpus membership for this sector; this file exists so the government
# sector still has candidates if crt.sh or the crawl is unreachable on a
# given run.
sector: government
source: curated_gov_portal
notes: "Ministries, central departments, constitutional bodies, provincial portals"
domains:
